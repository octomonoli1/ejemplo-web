<html>
    <head>
        
        <!-- Metadato (no se ve) obligatorio para poder visualizar las tildes con formato UTF - 8-->
         <meta charset="UTF-8"></metadata>

        <!-- Titulo de la web (Lo que se ve en la pestaña o ventana del navegador)-->
        <title>Gestión de alumnos</title>

        <!-- Cuidado que esto se suele olvidar: Incluir hojas de estilos y scripts -->
        <link rel="stylesheet" href="style.css">

        <!-- El defear permite que primero cargue TODO el HTML y posteriormente el script y que no haya errores de acceso a elementos no cargados todavía-->
        <script src="script.js" defer></script>

    </head>
    <body>

        <!-- HTML5 incorpora la etiqueta navbar para definir menus de navegación-->
         <nav>
            <h1>Gestión de alumnos</h1>
            <!-- Normalmente se definen como listas a las que posteriormente le quitaremos los estilos propios y le aplicaremos el estilo flex-->
            <ul class="menu">
                <li class="link" onclick="mostrar_formulario()">Inicio</li>
                <li class="link" onclick="mostrar_tabla()">Alumnos</li>
            </ul>
         </nav>

         <main>
            <section id="registro">
                <h2>Registro de usuario</h2>
                <form>
                    <label for="nombre"> Nombre: </label>
                    <input type="text" id="nombre" placeholder="Introduce tu nombre..." />
                    <label for="apellidos"> Apellidos: </label>
                    <input type="text" id="apellidos" placeholder="Introduce tus apellidos..." />
                    <label for="edad"> Edad: </label>
                    <input type="number" id="edad" placeholder="Introduce tu edad..." />
                    <label for="email"> Email: </label>
                    <input type="text" id="email" placeholder="Introduce tu email..." />
                    <label for="curso"> Curso: </label>
                    <select  id="curso">
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option id="1" value="DAW">DAW</option>
                        <option id="2" value="DAW">DAM</option>
                        <option id="3" value="DAW">ASIR</option>
                    </select>
                    <button id="enviar"> Enviar </button>
                    <button type="reset"> Limpiar </button>
                    <p id="mensajeOk"></p>
                    <p id="mensajeError"></p>
                </form>
            </section>

            <section id="alumnos">
                <h2>Listado de alumnos</h2>
                <table id="tabla_alumnos">
                    <tr>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Edad</th>
                        <th>Curso</th>
                    </tr>
                </table>
                <p id="recuento"></p>
            </section>
         </main>

         <footer>
            <p> Academia - 2026 </p>
         </footer>
    </body>
</html>
